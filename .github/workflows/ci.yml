name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  desktop:
    name: Cross-platform app on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Core tests
        run: dotnet run --project tests/Vstavka.Core.Tests -c Release

      - name: Localization tests
        if: ${{ !cancelled() }}
        run: dotnet run --project tests/Vstavka.Localization.Tests -c Release

      - name: macOS adapter logic tests
        if: ${{ !cancelled() }}
        run: dotnet run --project tests/Vstavka.Platform.MacOS.Tests -c Release

      - name: Windows adapter tests
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: dotnet run --project tests/Vstavka.Platform.Windows.Tests -c Release

      - name: Linux adapter tests
        if: ${{ !cancelled() }}
        run: dotnet run --project tests/Vstavka.Platform.Linux.Tests -c Release

      - name: Panel tests with headless renders
        if: ${{ !cancelled() }}
        run: dotnet run --project tests/Vstavka.Desktop.Tests -c Release -- --render "$RUNNER_TEMP/renders"

      - name: Build the app
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: dotnet build src/Vstavka.Desktop/Vstavka.Desktop.csproj -c Release

      - name: Build and validate the Windows Store package
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          dotnet publish src/Vstavka.Desktop -c Release -r win-x64 --self-contained -p:VstavkaWindowsStore=true -o artifacts/windows-store
          if ($LASTEXITCODE -ne 0) { throw 'Windows Store publish failed.' }
          ./scripts/Package-Store.ps1 -PublishDirectory artifacts/windows-store -LocalValidation

      - name: Upload Windows packaging logs
        if: ${{ failure() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-packaging-logs
          path: artifacts/packages/*/*.log
          if-no-files-found: ignore

      - name: Upload panel renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: panel-renders-${{ runner.os }}
          path: ${{ runner.temp }}/renders
          if-no-files-found: ignore

  gnome-headless:
    name: GNOME Shell integration (Wayland)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run GNOME Shell integration
        env:
          VSTAVKA_GNOME_LOG_DIR: ${{ runner.temp }}/gnome-headless
          VSTAVKA_APT_MIRROR: http://azure.archive.ubuntu.com/ubuntu
        run: bash gnome-extension/tests/run-headless.sh

      - name: Upload GNOME Shell log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: gnome-shell-log
          path: ${{ runner.temp }}/gnome-headless/gnome-shell.log
          if-no-files-found: warn
