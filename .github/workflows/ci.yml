name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  store-app:
    name: Windows Store app (WPF)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test suites, self-contained build and app self-test
        shell: pwsh
        run: ./scripts/Build-Preview.ps1

      - name: Store screenshot harness
        shell: pwsh
        run: |
          dotnet build tests/Vstavka.StoreScenes/Vstavka.StoreScenes.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Store scene harness build failed.' }
          $exe = 'tests/Vstavka.StoreScenes/bin/Release/net10.0-windows10.0.19041.0/Vstavka.StoreScenes.exe'
          $report = Join-Path $env:RUNNER_TEMP 'store-scenes.json'
          $scenes = Start-Process -FilePath $exe -ArgumentList @('--verify', '--output', ('"{0}"' -f $report)) -Wait -PassThru
          if ($scenes.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
            throw "Store scene verification failed (exit $($scenes.ExitCode))."
          }

      - name: Upload app check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-checks
          path: artifacts/app-checks.json
          if-no-files-found: ignore

  desktop:
    name: Cross-platform app on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Core tests
        run: dotnet run --project tests/Vstavka.Core.Tests -c Release

      - name: Localization tests
        if: ${{ !cancelled() }}
        run: dotnet run --project tests/Vstavka.Localization.Tests -c Release

      - name: macOS adapter logic tests
        if: ${{ !cancelled() }}
        run: dotnet run --project tests/Vstavka.Platform.MacOS.Tests -c Release

      - name: Windows adapter tests
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: dotnet run --project tests/Vstavka.Platform.Windows.Tests -c Release

      - name: Linux adapter tests
        if: ${{ !cancelled() }}
        run: dotnet run --project tests/Vstavka.Platform.Linux.Tests -c Release

      - name: Panel tests with headless renders
        if: ${{ !cancelled() }}
        run: dotnet run --project tests/Vstavka.Desktop.Tests -c Release -- --render "$RUNNER_TEMP/renders"

      - name: Build the app
        if: ${{ !cancelled() }}
        run: dotnet build src/Vstavka.Desktop/Vstavka.Desktop.csproj -c Release

      - name: Upload panel renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: panel-renders-${{ runner.os }}
          path: ${{ runner.temp }}/renders
          if-no-files-found: ignore

  gnome-headless:
    name: GNOME Shell integration (Wayland)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run GNOME Shell integration
        env:
          VSTAVKA_GNOME_LOG_DIR: ${{ runner.temp }}/gnome-headless
          VSTAVKA_APT_MIRROR: http://azure.archive.ubuntu.com/ubuntu
        run: bash gnome-extension/tests/run-headless.sh

      - name: Upload GNOME Shell log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: gnome-shell-log
          path: ${{ runner.temp }}/gnome-headless/gnome-shell.log
          if-no-files-found: warn
